version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bizpilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=bizpilot

  redis:
    image: redis:7-alpine
    container_name: bizpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
